name: Test
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: test-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  core-tests:
    name: Core Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Typescript check
        run: npm run tsc
      - name: Lint check
        run: npm run lint
      - name: Unit Tests
        run: npm run test
      - name: Integration Tests
        run: npm run integration-test

  browser-tests:
    name: Browser Tests (React ${{ matrix.react-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: core-tests
    strategy:
      matrix:
        react-version: [17, 18, 19]
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Install playwright dependencies
        run: npx playwright install --with-deps
      - name: Build
        run: npm run build
      - name: Test React ${{ matrix.react-version }}
        run: npm run browser-test-${{ matrix.react-version }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-react-${{ matrix.react-version }}
          path: packages/browser-test/playwright-report/
          retention-days: 30
